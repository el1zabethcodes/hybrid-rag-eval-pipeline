site_name: Hybrid RAG Assistant Documentation
site_url: https://example.com/docs
theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: light blue

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - API Reference: api.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
