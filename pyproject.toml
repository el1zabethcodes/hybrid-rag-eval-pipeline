[build-system]
requires = ["setuptools>=72.0.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hybrid-rag-eval-pipeline"
version = "0.1.0"
description = "Production-grade Hybrid RAG Assistant with cross-encoder reranking and Ragas evaluation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sentence-transformers>=3.0.0",
    "fastembed>=0.3.0",
    "qdrant-client>=1.9.0",
    "ragas>=0.1.0",
    "openai>=1.30.0",
    "litellm>=1.40.0",
    "httpx>=0.27.0",
    "tiktoken>=0.7.0",
    "pyyaml>=6.0.1",
    "streamlit>=1.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "anyio>=4.4.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short"

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
